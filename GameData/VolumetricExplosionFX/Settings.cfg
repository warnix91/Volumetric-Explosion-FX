// Internal development name. No gameplay patches or PartModules.
// Shipped defaults. The in-game settings window (toolbar button, flight and Space Center) saves the
// player's choices to PluginData/settings.cfg, which overrides this file.
VOLUMETRIC_EXPLOSION_FX
{
    enabled = true
    quality = Ultra
    explosions = true
    microDebris = true
    groundImpact = true
    waterImpact = true
    burst = true
    dynamicLighting = true
    volumetric = true
    // Hide stock explosion visuals (not their sound) where this mod shows its own effect.
    replaceStockVisuals = true
    // Refractive shock front and heat shimmer (screen distortion).
    shockwave = true
    // Fragments cut from the destroyed parts' own meshes and textures (visual only, no colliders).
    partDebris = true
    // Burning spilled propellant, smoke columns, scorched ground and smouldering wreckage.
    residue = true
    // How long the residue stays (seconds, 0 = none).
    residueSeconds = 45
    // Farthest camera distance (m) at which a new blast is shown; shown effects then stay visible.
    fxDistance = 10000
    intensity = 1.0
    debrisDensity = 1.0
    debug = false
    // Used only with quality = Custom.
    maximumEvents = 12
    maximumDebris = 768
    maximumLights = 3
    particlesPerEvent = 128
    maximumVolumes = 4
    volumeSteps = 32
    maximumDebrisParts = 16
    debrisTrianglesPerPart = 4500
}
// Optional config extension, no reference to RealFuels/RO assemblies required.
// VOLUMETRIC_EXPLOSION_RESOURCE { name = CustomPropellant   kind = Fuel, Cryogenic }
